# Сборка подписанного release-APK для Android.
#
# Триггеры: push в master, теги v*, ручной запуск (workflow_dispatch).
# APK доступен в артефактах запуска; при пуше тега v* дополнительно
# публикуется в GitHub Releases.
#
# Требуются секреты репозитория (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64   — keystore целиком: `base64 -w0 release.keystore`
#   RELEASE_KEYSTORE_PASSWORD — пароль хранилища
#   RELEASE_KEY_ALIAS         — алиас ключа
#   RELEASE_KEY_PASSWORD      — пароль ключа
# Если секретов нет, release собирается debug-подписью (см. android/app/build.gradle).
name: Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # android/ в .gitignore (managed workflow) — генерируем нативный проект;
      # плагин plugins/withReleaseSigning подставит release-подпись в build.gradle
      - name: Prebuild native project
        run: npx expo prebuild --platform android --clean --no-install

      # Если секрет не задан — шаг создаст пустой файл; build.gradle тогда
      # использует debug-подпись (переменная не выставляется).
      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: pozzy-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
