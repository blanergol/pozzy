# Проверки на push в master и в каждом pull request: типы + unit-тесты.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Отдельного ESLint в проекте нет — статический анализ покрывает tsc
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest
