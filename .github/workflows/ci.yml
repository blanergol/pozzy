# Checks on every push to master and on every pull request: types + unit tests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The project has no separate ESLint — static analysis is covered by tsc
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest
